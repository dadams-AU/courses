<h2 id="how-to-use-this-deck">How to use this deck</h2>
<ol>
<li>Each slide starts with a plain sentence saying <strong>what happened</strong>, then the details, then a shaded box saying <strong>why it matters</strong> for the chapter's argument.</li>
<li>If you read only the shaded boxes, you'll have the argument. If you read the whole deck, you'll have the evidence.</li>
<li>Slides marked <strong>→ paper</strong> hold claims, with page numbers, you can use in Discussion Paper 3.</li>
<li>Three glossary slides come next. Come back to them whenever a term is unfamiliar.</li>
<li>The last three slides set up the film and the paper.</li>
</ol>
<p>The chapter answers one question: <strong>why could Congress abolish welfare (AFDC) in 1996 when it has never been able to cut Social Security or Medicare?</strong></p>

<h2 id="glossary-1-the-programs-and-laws">Glossary 1: the programs and laws</h2>
<table>
<thead>
<tr>
<th>Term</th>
<th>What it is</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>AFDC</strong></td>
<td>Aid to Families with Dependent Children. Cash welfare for poor single-parent families, created in the 1935 Social Security Act. <strong>The program that was abolished in 1996</strong></td>
</tr>
<tr>
<td><strong>TANF</strong></td>
<td>Temporary Assistance for Needy Families. What replaced AFDC. Time-limited, work-required, run by the states with federal block grants</td>
</tr>
<tr>
<td><strong>PRWORA</strong></td>
<td>Personal Responsibility and Work Opportunity Reconciliation Act, August 1996. <strong>The law that made the switch.</strong> &quot;Welfare reform&quot; means this law</td>
</tr>
<tr>
<td><strong>Entitlement</strong></td>
<td>A benefit anyone who qualifies must receive; spending rises automatically with need. AFDC was one. TANF is not</td>
</tr>
<tr>
<td><strong>Block grant</strong></td>
<td>A fixed sum sent to each state to spend within broad rules. If need rises, the sum does not</td>
</tr>
<tr>
<td><strong>EITC</strong></td>
<td>Earned Income Tax Credit (1975). A tax refund for low-income people <strong>who work</strong>. Nothing for those who don't</td>
</tr>
</tbody>
</table>
</section>

<h2 id="glossary-2-the-ideas-the-authors-use-to-explain-it">Glossary 2: the ideas the authors use to explain it</h2>
<table>
<thead>
<tr>
<th>Concept</th>
<th>Plain meaning</th>
<th>Where it shows up</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Policy legacy</strong></td>
<td>What a program's own past design leaves behind: who defends it, how legitimate it looks. (Pierson's &quot;policy feedback,&quot; Week 4)</td>
<td>AFDC was never seen as &quot;earned,&quot; so it had few defenders</td>
</tr>
<tr>
<td><strong>Issue ownership</strong></td>
<td>Which party voters trust to handle a problem</td>
<td>By the 1980s, voters trusted Republicans on &quot;welfare&quot;</td>
</tr>
<tr>
<td><strong>Dependency vs. poverty</strong></td>
<td>Two ways to name the problem. <em>Poverty</em>: people lack money. <em>Dependency</em>: welfare itself damages people</td>
<td>Conservatives won by changing the name of the problem</td>
</tr>
<tr>
<td><strong>Veto point</strong></td>
<td>A place in the lawmaking process where a bill can be killed (a committee, a chamber, a veto)</td>
<td>Reform died at veto points in 1970, 1977, and 1994</td>
</tr>
<tr>
<td><strong>Layering</strong></td>
<td>Changing a program by adding rules on top rather than rewriting it</td>
<td>State waivers built a new system inside the old one</td>
</tr>
<tr>
<td><strong>Drift</strong></td>
<td>A program stays the same while the world changes around it, so its effect changes (Hacker, Week 4)</td>
<td>A benefit for stay-at-home mothers in a world where mothers work</td>
</tr>
</tbody>
</table>
</section>

<h2 id="the-law-in-one-slide">The law, in one slide</h2>
<p><strong>What happened:</strong> In August 1996 President Bill Clinton signed PRWORA. It abolished AFDC, a program that had existed since 1935, and replaced it with TANF.</p>
<table>
<thead>
<tr>
<th>Provision</th>
<th>The rule under TANF</th>
</tr>
</thead>
<tbody>
<tr>
<td>Entitlement</td>
<td><strong>Gone.</strong> Each state gets a fixed block grant, frozen through 2002</td>
</tr>
<tr>
<td>Time limit</td>
<td><strong>Five years</strong> of federal cash aid in a lifetime, per adult</td>
</tr>
<tr>
<td>Work</td>
<td>Must be in a work activity after <strong>two years</strong> on aid</td>
</tr>
<tr>
<td>States</td>
<td>Must keep spending <strong>80%</strong> of what they spent before · may exempt <strong>20%</strong> of their caseload from the limit · may refuse extra money for a child born on aid (a &quot;family cap&quot;)</td>
</tr>
<tr>
<td>Marriage</td>
<td>The law's first page calls marriage &quot;an essential institution of a successful society&quot;</td>
</tr>
</tbody>
</table>
<div class="point"><b>Why it matters:</b> In 1996, <b>4.5 million families</b> were on AFDC, nearly all single mothers with children. This was the only time a major federal benefit program was repealed outright. Social Security and Medicare have been trimmed and adjusted. AFDC was ended.</div>
<p><span class="muted">pp. 24–25, 61–62</span></p>

<h2 id="the-puzzle">The puzzle</h2>
<div class="big">A Democratic president signed rules that "would have been denounced as . . . right-wing extremism a quarter century earlier."</div>
<p><span class="muted">p. 24</span></p>
<p>Why welfare and not Social Security? Why 1996 and not 1970, 1977, or 1988? How did a Democrat end up signing a Republican bill?</p>

<h2 id="the-authors-answer-in-advance">The authors' answer, in advance</h2>
<p>Béland and Waddan explain 1996 with four things working together. Keep them in mind; every slide feeds one of them.</p>
<ol>
<li><strong>A weak policy legacy.</strong> AFDC was never &quot;earned,&quot; so nobody powerful defended it.</li>
<li><strong>Issue ownership moved.</strong> Voters came to trust Republicans, not Democrats, on welfare.</li>
<li><strong>The idea changed.</strong> The problem stopped being <em>poverty</em> (too little money) and became <em>dependency</em> (welfare harms people).</li>
<li><strong>The institutions finally lined up.</strong> Earlier reforms died at veto points. In 1996 a disciplined Republican Congress met a Democratic president who had promised reform and couldn't afford to veto it.</li>
</ol>
<div class="point"><b>Why it matters:</b> The same four things explain why Social Security survived. Strong legacy, Democratic ownership, no reframing, and veto points that held.</div>
<p><span class="muted">pp. 68–71</span></p>
</section>

<h2 id="1935-afdc-is-born-the-weaker-sibling">1935: AFDC is born the weaker sibling</h2>
<p><strong>What happened:</strong> The 1935 Social Security Act created both Social Security and AFDC. They were built on different principles from the first day.</p>
<ul>
<li><strong>Social Security</strong> was paid for by workers' payroll taxes, so recipients could say they had <em>earned</em> it. <strong>AFDC</strong> was paid from general taxes to people in need. No one could claim to have earned it.</li>
<li>AFDC was assigned to the Social Security Board, &quot;a male dominated agency&quot; that favored insurance programs and neglected aid to the poor.</li>
<li>Southern members of Congress stripped out national standards. States decided who was eligible and how much they got. Most Black mothers in the South were excluded.</li>
<li>Eligibility turned on &quot;worthiness&quot;: widows yes, others investigated, including midnight raids to check for a man in the house.</li>
</ul>
<table>
<thead>
<tr>
<th>Average monthly benefit, 1940</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>National</td>
<td><strong>$32.39</strong></td>
</tr>
<tr>
<td>Alabama</td>
<td><strong>$13.63</strong></td>
</tr>
</tbody>
</table>
<div class="point"><b>Why it matters:</b> This is the <b>policy legacy</b>. From birth, AFDC lacked the "I earned it" claim that protects Social Security, and its rules varied by state. Both facts come back in 1996.</div>
<p><span class="muted">pp. 26–27</span></p>

<h2 id="the-1960s-the-rolls-triple-and-no-politician-takes-credit">The 1960s: the rolls triple, and no politician takes credit</h2>
<p><strong>What happened:</strong> AFDC grew from a small program into an entitlement, mostly because courts and agencies opened the doors, not because Congress voted to.</p>
<table>
<thead>
<tr>
<th>Families on AFDC, monthly average</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>1950</td>
<td>651,000</td>
</tr>
<tr>
<td>1960</td>
<td>803,000</td>
</tr>
<tr>
<td>1970</td>
<td><strong>1.9 million</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>Applicants approved: <strong>one in three</strong> (1960) → <strong>90%</strong> (1971). Cost: <strong>$1 billion</strong> (1960) → <strong>$6.2 billion</strong> (1971).</li>
<li>The <strong>Supreme Court</strong> struck down state rules that denied aid to newcomers, to mothers with a &quot;substitute father,&quot; or after a &quot;man in the house&quot; raid.</li>
<li>Nobody in Congress campaigned for this expansion. Nobody claimed credit.</li>
</ul>
<div class="point"><b>Why it matters:</b> Because unelected judges and bureaucrats expanded welfare, conservatives could later say its defenders were "out of touch with the values of most Americans." The expansion gave AFDC more recipients but no political champions. Weak legacy again.</div>
<p><span class="muted">pp. 29–30</span></p>
</section>

<h2 id="the-road-not-taken-nixons-guaranteed-income">The road not taken: Nixon's guaranteed income</h2>
<p><strong>What happened:</strong> In 1969, Republican president Richard Nixon proposed the Family Assistance Plan (FAP), which would have guaranteed every family a minimum income. It nearly passed.</p>
<ul>
<li>A &quot;negative income tax&quot;: a family of four with no income would get <strong>$1,600</strong> a year, shrinking gradually to zero at <strong>$3,920</strong>. Aid depended on income, not on why you were poor.</li>
<li>Passed the House <strong>243–155</strong> in 1970. Died in the Senate Finance Committee, <strong>10–6</strong>.</li>
<li>Killed from both ends. Conservatives (Reagan, Agnew) called it a giveaway. The National Welfare Rights Organization, speaking for recipients, called $1,600 an insult and demanded $5,500.</li>
<li>It would have remade the South. Mississippi paid <strong>$46 a month</strong>; a quarter of Louisiana would have qualified. One Georgia congressman: &quot;There's not going to be anybody left to roll these wheelbarrows.&quot;</li>
</ul>
<div class="point"><b>Why it matters:</b> This shows the <b>veto point</b> at work: a bill with majority support can die in one committee. And it shows how far the debate moved. In 1970 a Republican proposed guaranteeing income. By 1996 both parties demanded work requirements.</div>
<p><span class="muted">pp. 31–35</span></p>
</section>

<h2 id="why-the-dead-plan-still-matters-worthy-vs-unworthy">Why the dead plan still matters: worthy vs. unworthy</h2>
<p><strong>What happened:</strong> Nixon tried again in 1971 (HR 1), and Carter tried in 1977 (the PBJI). Both died. What Congress passed instead was the EITC (1975), a benefit only for people who work.</p>
<ul>
<li>FAP sorted people <strong>by income</strong>. It didn't ask why you were poor. AFDC sorted people <strong>by worthiness</strong> (widow? working? married?).</li>
<li>Liberals at the time dismissed FAP as &quot;nothing new, nothing startling.&quot; The authors say it was both. Liberals assumed welfare policy was theirs to set and missed what was on offer.</li>
<li>The EITC helps the <strong>working</strong> poor and gives nothing to the non-working poor. It cost more than AFDC by 1996, and it <strong>reinforced</strong> the deserving/undeserving line instead of erasing it.</li>
<li>1972 Republican platform: &quot;We flatly oppose . . . a government-guaranteed income.&quot; The Democrats attacked Nixon's &quot;forced work requirements.&quot; By 1996 both parties were for forced work requirements.</li>
</ul>
<div class="point"><b>Why it matters:</b> The lasting American choice was to help the poor who work and judge the poor who don't. Every later reform built on that line. 1996 was its sharpest expression.</div>
<p><span class="muted">pp. 34–36</span></p>
</section>

<h2 id="drift-the-program-stood-still-while-the-country-moved">Drift: the program stood still while the country moved</h2>
<p><strong>What happened:</strong> AFDC was designed in 1935 so poor mothers could stay home with their children. By the 1980s most mothers worked, and the poor had become mostly female-headed families.</p>
<table>
<thead>
<tr>
<th>Share of the poor (under 65) living in . . .</th>
<th>1960</th>
<th>1980</th>
</tr>
</thead>
<tbody>
<tr>
<td>households headed by men</td>
<td>65%</td>
<td>44.6%</td>
</tr>
<tr>
<td>households headed by women</td>
<td>21.2%</td>
<td><strong>42.2%</strong></td>
</tr>
</tbody>
</table>
<table>
<thead>
<tr>
<th>Mothers of children under 6 who work for pay</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>1960</td>
<td>under 20%</td>
</tr>
<tr>
<td>1991</td>
<td><strong>58%</strong></td>
</tr>
</tbody>
</table>
<p>Also: by the 1980s most AFDC mothers were not widows but divorced, separated, or never married.</p>
<div class="point"><b>Why it matters:</b> This is <b>drift</b>. Nobody changed AFDC, but as society changed, a benefit that let mothers stay home came to look like paying people not to work. Heclo: "a program that stays the same while the society around it is changing can actually amount to a transformed policy."</div>

<h2 id="the-battle-of-ideas-1981%E2%80%931987-the-problem-gets-a-new-name">The battle of ideas, 1981–1987: the problem gets a new name</h2>
<p><strong>What happened:</strong> A series of conservative writers argued that welfare itself caused poverty, by rewarding not working and not marrying. Their ideas moved from the fringe to the mainstream in six years.</p>
<table>
<thead>
<tr>
<th>Who</th>
<th>The claim</th>
<th>The remedy</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>George Gilder</strong>, <em>Wealth and Poverty</em> (1981)</td>
<td>Cash benefits erode marriage and the work habits of the poor</td>
<td>Cut welfare</td>
</tr>
<tr>
<td><strong>Charles Murray</strong>, <em>Losing Ground</em> (1984)</td>
<td>Rising rolls and births outside marriage are &quot;rational responses to changes in the rules&quot;</td>
<td>A &quot;thought experiment&quot;: scrap all aid to working-age adults</td>
</tr>
<tr>
<td><strong>Lawrence Mead</strong> (1986–92)</td>
<td>The poor need the discipline of work and won't take jobs on their own</td>
<td>&quot;New paternalism&quot;: require work, punish refusal, but have government help people comply</td>
</tr>
<tr>
<td><strong>Working Seminar</strong> (1987), 20 experts incl. some liberals</td>
<td>&quot;Money income alone does not define poverty&quot;</td>
<td>Time limits, sanctions, let states experiment</td>
</tr>
</tbody>
</table>
<div class="point"><b>Why it matters:</b> This is the <b>idea shift</b>. The question changed from "how much do the poor need?" to "what is welfare doing to the poor?" PRWORA ended up looking like Mead's plan (require work, keep government involved), not Murray's (abolish everything). The 1987 Seminar "uncannily anticipated" the 1996 law.</div>
<p><span class="muted">pp. 38–41</span></p>
</section>

<h2 id="the-liberal-response-an-uncertain-trumpet">The liberal response: &quot;an uncertain trumpet&quot;</h2>
<p><strong>What happened:</strong> Liberals disputed the conservative story but never produced a winning counter-story. Their own leading expert ended up proposing time limits.</p>
<ul>
<li><strong>William Julius Wilson</strong> (1987): the cause of welfare growth is the disappearance of jobs from inner cities, not the values of the poor. Widely praised, but he admitted liberals &quot;lacked a convincing rebuttal&quot; to conservatives.</li>
<li><strong>David Ellwood</strong>, <em>Poor Support</em> (1988): a liberal who proposed <strong>time limits</strong> on cash welfare, paired with a <strong>guaranteed government job</strong> for anyone who couldn't find work.</li>
<li>Ellwood joined the Clinton White House and helped write Clinton's 1994 bill. When the final 1996 law kept his time limit and dropped his job guarantee, he <strong>resigned and opposed it</strong>.</li>
</ul>
<div class="point"><b>Why it matters:</b> When the opposition's own expert accepts your premise (that welfare should end at some point), the argument is half over. Liberals ended up debating <i>how</i> to limit welfare, not <i>whether</i>.</div>
<p><span class="muted">pp. 41–43</span></p>
</section>

<h2 id="the-reagan-years-cuts-speeches-and-a-halfway-reform">The Reagan years: cuts, speeches, and a halfway reform</h2>
<p><strong>What happened:</strong> Reagan cut AFDC in 1981, attacked &quot;dependency&quot; in speeches for eight years, and signed a compromise reform in 1988 that kept AFDC but added work rules.</p>
<ul>
<li><strong>1981 (OBRA).</strong> Tighter income and asset limits: about <strong>400,000</strong> families dropped, <strong>300,000</strong> more had benefits cut. Working while on AFDC stopped paying after four months, so fewer recipients worked. That shrank the program's support further.</li>
<li><strong>Speeches.</strong> 1986: the &quot;spider's web of dependency.&quot; 1988: welfare &quot;created a poverty trap . . . Dependency has become the one enduring heirloom.&quot;</li>
<li><strong>1988 Family Support Act (FSA).</strong> States must put <strong>20%</strong> of recipients in a training program (JOBS) by 1995. Two-parent families covered everywhere. Twelve months of Medicaid after leaving welfare. Cost: $3 billion over five years. Passed with big bipartisan majorities.</li>
</ul>
<div class="point"><b>Why it matters:</b> The FSA was "full of compromises," but its conservative half lasted and its liberal half didn't. It put the <b>principle of required work</b> into law. The authors call it "a staging post rather than the final destination."</div>
<p><span class="muted">pp. 43–46</span></p>
</section>

<h2 id="the-1990s-crisis-public-opinion-and-who-owns-the-issue">The 1990s &quot;crisis&quot;: public opinion and who owns the issue</h2>
<p><strong>What happened:</strong> Right after the 1988 reform, the rolls surged again. The public had turned hard against welfare, and voters now trusted Republicans on it.</p>
<table>
<thead>
<tr>
<th>People on AFDC</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>1980</td>
<td>10.6 million</td>
</tr>
<tr>
<td>1988</td>
<td>10.9 million</td>
</tr>
<tr>
<td>1992</td>
<td><strong>13.6 million</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>Polls, 1994: <strong>89%</strong> want a two-year limit followed by work. <strong>76%</strong> say a mother who has another child on welfare should get no increase. <strong>75%</strong> say welfare makes people &quot;too dependent.&quot;</li>
<li>Martin Gilens: after the mid-1960s the news media pictured welfare recipients as Black. &quot;The symbolic power of welfare . . . stems in large measure from its racial undertones.&quot; (Gilens is a Week 12 reading.)</li>
<li>A Clinton budget official conceded the public &quot;believe[s] that poor people should play by the same rules as the middle class. When you don't work, you don't get paid.&quot;</li>
</ul>
<div class="point"><b>Why it matters:</b> <b>Issue ownership</b> had flipped. Democrats built welfare, but by 1992 "welfare" was a Republican issue, a word for a problem rather than a program. A Democrat who wanted to win had to run against it.</div>
<p><span class="muted">pp. 46–48 · <strong>→ paper</strong></span></p>

<h2 id="october-23-1991">October 23, 1991</h2>
<div class="big">"In a Clinton administration we're going to put an end to welfare as we know it."</div>
<p>Candidate Bill Clinton, repeated for a year. A Democratic pollster called the line &quot;pure heroin.&quot;</p>
<p><strong>What he was doing:</strong> stealing the issue back. By attacking welfare, a Democrat could prove he was not an old-style liberal. It worked as a campaign line. It also committed him to a result.</p>

<h2 id="clintons-own-bill-1994-big-promise-small-plan">Clinton's own bill, 1994: big promise, small plan</h2>
<p><strong>What happened:</strong> Clinton's administration finally wrote its own welfare bill, the Work and Responsibility Act (WRA). It was tougher than any Democratic bill before it, and it went nowhere.</p>
<ul>
<li>The idea: two years of cash aid, then a required community-service job. Teen mothers must stay in school. Mothers must name the father.</li>
<li>But it had to be paid for without new taxes. The White House found <strong>$9.3 billion</strong> over five years, mostly by cutting aid to legal immigrants. Enough to move only <strong>170,000</strong> of <strong>5 million</strong> adults into subsidized jobs by 1999.</li>
<li>Inside fight: Ellwood wanted help to continue for anyone making a real effort. Bruce Reed, who coined &quot;end welfare as we know it,&quot; wanted a hard end date.</li>
<li>Liberals attacked it in hearings; Newt Gingrich mocked it: &quot;brilliant at describing a Ferrari, but his staff continues to deliver a Yugo.&quot; The budget, NAFTA, and health care crowded it out. It never got a vote.</li>
</ul>
<div class="point"><b>Why it matters:</b> Clinton had promised to end welfare and had not. That left the issue open for Republicans to claim after they won Congress in November 1994. The authors' point: a promise without a law is an invitation to the other side.</div>
<p><span class="muted">pp. 49–51</span></p>
</section>

<h2 id="state-waivers-building-the-new-system-inside-the-old-one">State waivers: building the new system inside the old one</h2>
<p><strong>What happened:</strong> Through the early 1990s, Washington let states run AFDC under their own experimental rules. By 1996 more than half the states were doing it, and the experiments became the evidence for national reform.</p>
<ul>
<li>Reagan, 1988: &quot;a thousand sparks of genius in 50 states.&quot; Clinton, 1993, promised to approve waivers even when he disagreed with them.</li>
<li><strong>Riverside County, California:</strong> told recipients to take &quot;a job, any job,&quot; now. It moved more people into work than the five counties that stressed education and training first. <strong>&quot;Work first&quot;</strong> became the national lesson.</li>
<li><strong>Wisconsin,</strong> under Gov. Tommy Thompson, went furthest: time limits, sanctions, a plan to end the entitlement at the state level. Thompson's spokesman on block grants: &quot;No longer would we have to go to Washington and kiss somebody's ring.&quot;</li>
</ul>
<div class="point"><b>Why it matters:</b> This is <b>layering</b>. Nobody repealed AFDC, but state experiments stacked new rules on top of it until time limits were already real somewhere. Next slide: what the experiments actually showed.</div>
<p><span class="muted">pp. 51–53</span></p>
</section>

<h2 id="what-the-waiver-experiments-proved-and-what-they-were-said-to-prove">What the waiver experiments proved, and what they were said to prove</h2>
<p><strong>What happened:</strong> Every waiver came with a research requirement, so by 1996 there were dozens of studies. They did not agree.</p>
<ul>
<li>The results were &quot;mixed and inconclusive.&quot; Income gains were small. Many people who found work stayed poor enough to keep getting welfare.</li>
<li>Liberals read the studies as: moving people to work is slow, so change gradually. Conservatives read them as: change works, so change dramatically.</li>
<li>The studies that got attention were the ones that fit the conservative reading, Riverside above all.</li>
<li>Wisconsin's political situation made bold reform easy there. Whether it could be repeated nationally was never tested. It became the model anyway.</li>
</ul>
<div class="point"><b>Why it matters:</b> The evidence was ambiguous; the political use of it was not. Rogers-Dillon: pilots "made time-limited welfare a reality and took away the argument that it could not be done." Mead: "Without Wisconsin's example, PRWORA would have been less radical." For your paper, this is a claim about how evidence gets used, with a page number.</div>
<p><span class="muted">pp. 52–55 · <strong>→ paper</strong></span></p>
</section>

<h2 id="fifty-programs-before-there-were-fifty-programs">Fifty programs before there were fifty programs</h2>
<p><strong>What happened:</strong> Even under one federal law, AFDC paid wildly different amounts depending on the state. In 1995 a family's AFDC income, as a share of the poverty line:</p>
<table>

<tr>
<th></th>
<th></th>
</tr>

<tbody>
<tr>
<td>Louisiana</td>
<td><strong>16.2%</strong></td>
</tr>
<tr>
<td>Alabama, Texas</td>
<td>16.5%</td>
</tr>
<tr>
<td>National average</td>
<td><strong>41%</strong></td>
</tr>
<tr>

<div class="point"><b>Why it matters:</b> The variation came first; block grants in 1996 made it official. When Campbell describes "fifty different worlds of social assistance" (Wednesday's reading), this is where they come from.</div>

<h2 id="1995-the-new-republican-congress-writes-the-bill">1995: the new Republican Congress writes the bill</h2>
<p><strong>What happened:</strong> Republicans won Congress in November 1994 with welfare reform in their Contract with America. In 1995 they passed a bill far to the right of Clinton's, and Clinton endorsed the Senate version.</p>
<ul>
<li>The Contract's bill: a <strong>five-year</strong> lifetime limit, 35 hours of work a week after two years.</li>
<li>Pressure from the right: the Heritage Foundation's <strong>Robert Rector</strong> (author of this week's recommended reading) attacked the leadership's first draft as not &quot;real reform.&quot; The pattern: denounce the moderate bill, write a tougher one, lobby until the tougher one is the standard.</li>
<li><strong>Block grants</strong> won over Republican governors: a fixed sum, fewer federal strings. Frozen grants looked fine because the rolls were already falling.</li>
<li>One overreach: Gingrich's talk of orphanages for the children of mothers who hit the limit. Democrats won that round, and he dropped it.</li>
</ul>
<div class="point"><b>Why it matters:</b> The bill was written by the people who had spent fifteen years renaming the problem. Block grants did the institutional work: once states got a fixed sum, there was no entitlement left to defend.</div>
<p><span class="muted">pp. 55–57</span></p>
</section>

<h2 id="1995-the-democrats-answer-is-almost-the-same-bill">1995: the Democrats' answer is almost the same bill</h2>
<p><strong>What happened:</strong> Rather than defend AFDC, House Democrats offered their own time-limited bill. It lost, and most Senate Democrats then voted for the Republican bill.</p>
<ul>
<li>House Democrats' alternative (the Deal bill) had a <strong>four-year</strong> lifetime limit and let states adopt family caps. By any earlier Democratic standard, &quot;an extraordinarily conservative measure.&quot; It lost anyway.</li>
<li>House Republican bill passed <strong>234–199</strong>, March 1995.</li>
<li>The Senate wrote a more moderate version (more child-care money, family cap as a state option, no ban on aid to teen mothers). Clinton endorsed it. It passed <strong>87–12</strong> in September 1995.</li>
<li>After that vote the authors call it &quot;clear that any final compromise bill . . . would be at least as conservative as the Senate bill.&quot;</li>
</ul>
<div class="point"><b>Why it matters:</b> Hard time limits and the end of the entitlement were now the consensus of <i>both</i> parties. The only open question was how far right the final bill would land, and whether Republicans wanted to give Clinton a bill to sign or a bill to veto.</div>
<p><span class="muted">pp. 58–60</span></p>
</section>

<h2 id="two-liberals-hand-republicans-a-number">Two liberals hand Republicans a number</h2>
<p><strong>What happened:</strong> In 1994 Mary Jo Bane and David Ellwood, both liberal scholars working for Clinton, published a new way of counting how long people stay on welfare. Republicans used it.</p>
<table>
<thead>
<tr>
<th>How you count</th>
<th>Share of AFDC mothers whose total time on welfare reaches <strong>10+ years</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>Of everyone who <strong>starts</strong> a spell on welfare</td>
<td><strong>14%</strong></td>
</tr>
<tr>
<td>Of everyone on the rolls <strong>on a given day</strong></td>
<td><strong>48%</strong></td>
</tr>
<tr>
<td>Same, but counting people who leave and come back</td>
<td><strong>56.6%</strong></td>
</tr>
</tbody>
</table>
<p>All three numbers are true. Most people who ever use welfare use it briefly. But on any given day, most of the people on the rolls are in the middle of a long stay, because the long-stayers pile up.</p>
<div class="point"><b>Why it matters:</b> Week 1 again: <b>flow is not stock</b>. "Welfare is temporary for most users" and "most current recipients are long-term" are both correct. Which one you quote depends on which question you're asking. Republicans quoted 48%.</div>
<p><span class="muted">p. 58 · <strong>→ paper</strong></span></p>
</section>

<h2 id="two-vetoes-then-a-signature">Two vetoes, then a signature</h2>
<p><strong>What happened:</strong> Clinton vetoed welfare reform twice, in December 1995 and January 1996. In August 1996, facing re-election, he signed the third bill.</p>
<ul>
<li><strong>Veto 1:</strong> welfare was buried inside a huge budget bill. Clinton fought that bill over <strong>Medicare</strong> cuts and won the government-shutdown fight. Welfare wasn't the point.</li>
<li><strong>Veto 2:</strong> the January bill also cut food stamps and school lunches.</li>
<li><strong>What changed by summer:</strong> Tommy Thompson took over the governors' association. Bob Dole left the Senate to run for president. Republicans feared losing Congress and wanted a law to campaign on. So they sent a <strong>stand-alone welfare bill</strong> with nothing else in it to veto.</li>
</ul>
<div class="point"><b>Why it matters:</b> The first two vetoes were about other things in the bill, not about welfare. Republicans learned the lesson and removed everything else, which left Clinton nowhere to hide.</div>
<p><span class="muted">pp. 60–61</span></p>
</section>

<h2 id="august-1996-the-signature">August 1996: the signature</h2>
<p><strong>What happened:</strong> On August 1, 1996, Clinton's advisers met to decide. The policy staff said veto; the political staff said sign. He signed.</p>
<ul>
<li>Urging a veto: HHS Secretary Donna Shalala, chief of staff Leon Panetta, and most policy advisers.</li>
<li>Urging a signature: Bruce Reed, the political advisers, and Hillary Clinton.</li>
<li>Pollster Dick Morris told Clinton a veto would turn &quot;a fifteen-point win into a three-point loss.&quot; George Stephanopoulos: Clinton's &quot;heart urged a veto, while his head calculated the risk.&quot;</li>
<li>Once the president said he would sign, congressional Democrats saw no point standing to his left.</li>
</ul>
<table>
<thead>
<tr>
<th>Final votes</th>
<th>House</th>
<th>Senate</th>
</tr>
</thead>
<tbody>
<tr>
<td>All members</td>
<td><strong>328–101</strong></td>
<td><strong>78–21</strong></td>
</tr>
<tr>
<td>Democrats only</td>
<td>98–98</td>
<td>25–21</td>
</tr>
</tbody>
</table>
<div class="point"><b>Why it matters:</b> The <b>veto point</b> that killed reform in 1970 (a Senate committee) and 1994 (the president's own party) gave way because the president had promised reform and the bill was built so a veto would cost him the election. Institutions and ideas together.</div>
<p><span class="muted">pp. 62–63</span></p>
</section>

<h2 id="did-it-work-depends-on-which-column-you-read">Did it work? Depends on which column you read</h2>
<p><strong>What happened:</strong> By 2000 supporters called reform an unqualified success. Critics pointed to who had been left out. Both used real numbers.</p>
<table>
<thead>
<tr>
<th>Evidence of success</th>
<th>Evidence of failure</th>
</tr>
</thead>
<tbody>
<tr>
<td>Families on welfare fell from <strong>4.4 million</strong> (Aug. 1996) to <strong>2.5 million</strong> (Sept. 1999), a <strong>44%</strong> drop</td>
<td>Of families poor enough to qualify, the share actually getting aid fell from <strong>84%</strong> (1995) to <strong>40%</strong> (2005)</td>
</tr>
<tr>
<td>The number of never-married mothers who moved from welfare to work rose <strong>50%</strong>, 1993–99</td>
<td>More single parents ended up <strong>neither working nor receiving aid</strong></td>
</tr>
<tr>
<td>Rep. Clay Shaw, 2006: &quot;one of the most successful policy changes in our nation's history&quot;</td>
<td>In the 2008 recession, unemployment <strong>doubled</strong> but the TANF caseload rose only <strong>13%</strong>. The safety net didn't catch the fall</td>
</tr>
</tbody>
</table>
<p>A 2005 law (the Deficit Reduction Act) made the work rules harder to meet, so states had even more reason to keep families off the rolls.</p>
<div class="point"><b>Why it matters:</b> "Fewer people on welfare" and "fewer poor people" are different claims. Rank's Section IV (Wednesday) asks the same question with more data. Your paper can use either column, but say which one.</div>
<p><span class="muted">pp. 63–68 · <strong>→ paper</strong></span></p>
</section>

<h2 id="nobody-came-back-for-it">Nobody came back for it</h2>
<p><strong>What happened:</strong> Once passed, welfare reform became permanent. Neither party has tried to reverse it.</p>
<ul>
<li>2000: Al Gore attacked a Democratic rival for voting <strong>against</strong> PRWORA.</li>
<li>2002–05: the only fight was whether to require <strong>40 hours</strong> of work a week instead of 30. Senator Hillary Clinton proposed 37.</li>
<li>2008: Senator Obama called it &quot;an imperfect reform&quot; that erased the line between &quot;the deserving poor and the undeserving welfare poor. . . . Now, everybody was poor, and everybody had to work.&quot; Hillary Clinton: AFDC &quot;did not work.&quot;</li>
<li>2009: the stimulus added a <strong>$5 billion</strong> TANF emergency fund. Senate Republicans let it expire in 2010.</li>
<li>Paul Krugman, a critic: the law caused &quot;a great deal of hardship,&quot; but it &quot;took that issue off the table&quot; and drained the race politics out of welfare.</li>
</ul>
<div class="point"><b>Why it matters:</b> Some Democrats had hoped ending welfare would let the public hear a liberal case for the poor. Soss and Schram (the grad reading) checked and found public opinion didn't move. The law settled the argument by ending it.</div>
<p><span class="muted">pp. 64–68</span></p>
</section>

<h2 id="the-answer-why-welfare-and-not-social-security">The answer: why welfare, and not Social Security</h2>
<table>
<thead>
<tr>
<th></th>
<th>AFDC (abolished 1996)</th>
<th>Social Security (still standing)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1. Policy legacy</strong></td>
<td>Not &quot;earned.&quot; No organized constituency. Even recipients blamed other recipients. State waivers had hollowed out the bureaucracy that ran it</td>
<td>&quot;Earned&quot; through payroll taxes. A huge, organized constituency. Clinton won the 1995 shutdown fight by defending it</td>
</tr>
<tr>
<td><strong>2. Issue ownership</strong></td>
<td>Became a Republican issue in the 1980s. Clinton took it back only by promising to end the program</td>
<td>Still a Democratic issue</td>
</tr>
<tr>
<td><strong>3. Ideas</strong></td>
<td>Problem renamed from <strong>poverty</strong> (what the poor are owed) to <strong>dependency</strong> (what welfare does to people)</td>
<td>No comparable renaming ever stuck</td>
</tr>
<tr>
<td><strong>4. Institutions</strong></td>
<td>Veto points held in 1970, 1977, 1994. Breached in 1996 when a disciplined Republican Congress met a president who had promised reform</td>
<td>Veto points held, every time</td>
</tr>
</tbody>
</table>
<div class="point"><b>The chapter in one sentence:</b> AFDC fell because it was weakly defended, politically re-owned, intellectually renamed, and finally caught at a moment when the institutions that usually block reform all pointed the same way.</div>
<p><span class="muted">pp. 68–71</span></p>

<h2 id="carry-this-into-the-film">Carry this into the film</h2>
<p><em>Two American Families</em> follows two working-class households in <strong>Milwaukee, Wisconsin</strong> from 1991 to 2024. You just read that Wisconsin was the state that led welfare reform. These families lived through it.</p>
<p>As you watch, look for:</p>
<ol>
<li><strong>Work first.</strong> The reform's rule was &quot;a job, any job.&quot; What do those jobs look like inside one family? What do they pay?</li>
<li><strong>The 40%.</strong> The chapter says most families poor enough to qualify for TANF don't get it. Do you see a moment where a family needs help and doesn't get it, or doesn't ask?</li>
<li><strong>Drift.</strong> Who in the household works? Does the system notice?</li>
<li><strong>Flow and stock.</strong> Is this family a short spell of hardship or a long one?</li>
<li><strong>The 44%.</strong> Welfare rolls fell 44%. If these families left the rolls, does that count as success?</li>
</ol>
<p>Two households are not national data. That gap is <strong>step 4</strong> of your paper: which kind of evidence fits the claim you picked?</p>
</section>

<h2 id="discussion-paper-3-due-friday-1023-1159-pm">Discussion Paper 3, due Friday 10/23, 11:59 p.m.</h2>
<p>About <strong>600 words</strong>. One moment from the film, one claim from the readings. The full prompt is on Canvas.</p>
<ol>
<li><strong>One moment</strong> from the film: a specific scene, person, or decision I could find.</li>
<li><strong>One claim</strong> from the readings about what reform did, with a <strong>page number</strong>. Claims from this chapter you could use:
<ul>
<li>Welfare rolls fell 44% between 1996 and 1999 (p. 63)</li>
<li>Families getting aid, of those eligible: 84% in 1995, 40% in 2005 (p. 67)</li>
<li>&quot;Work first&quot; moved more people into jobs than training did (p. 53)</li>
<li>On any given day, 48% of recipients are in a stay of ten years or more (p. 58)</li>
<li>In the 2008 recession, unemployment doubled but caseloads rose only 13% (p. 68)</li>
</ul>
</li>
<li><strong>Does the moment support or challenge the claim?</strong> Show how, with detail from the scene.</li>
<li><strong>Which do you trust more</strong> on this point, the film or the reading, and why? Say which kind of evidence fits the kind of claim.</li>
</ol>
<p>Wednesday's deck adds claims from Campbell and Rank.</p>
