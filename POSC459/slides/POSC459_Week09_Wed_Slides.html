<h2 id="how-to-use-this-deck">How to use this deck</h2>
<ol>
<li>Same design as Monday: each slide opens with <strong>what happened</strong>, then the details, then a shaded box saying <strong>why it matters</strong>. Read only the boxes and you'll have the argument.</li>
<li>Slides marked <strong>→ paper</strong> hold claims, with page numbers, for Discussion Paper 3.</li>
<li>Two glossary slides come next. Monday's glossary (AFDC, TANF, PRWORA, block grant, entitlement) still applies.</li>
<li>After Campbell, seven slides walk Rank, Eppard, and Bullock, Section IV. The last four connect the readings, set up the film, and restate the paper.</li>
</ol>
<p>Three questions. <strong>Campbell ch. 4:</strong> why do programs built to help the poor keep them poor? <strong>Campbell ch. 5:</strong> why does the answer depend on the state? <strong>Rank §IV:</strong> does welfare work?</p>

<h2 id="glossary-1-the-programs-in-these-chapters">Glossary 1: the programs in these chapters</h2>
<table>
<thead>
<tr>
<th>Term</th>
<th>What it is</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Means-tested program</strong></td>
<td>A benefit you get only if your income <em>and usually your assets</em> are low enough. TANF, SSI, Medicaid, CHIP, SNAP, housing aid, the EITC. The opposite of social insurance (Social Security, Medicare), which you get by having paid in</td>
</tr>
<tr>
<td><strong>SSI</strong></td>
<td>Supplemental Security Income. Federal cash for poor people who are elderly, blind, or disabled. Marcella's program. Most states add a small supplement</td>
</tr>
<tr>
<td><strong>Medicaid / Medi-Cal</strong></td>
<td>Public health insurance for the poor, run jointly by Washington and each state. Medi-Cal is California's version</td>
</tr>
<tr>
<td><strong>Share of Cost Medi-Cal</strong></td>
<td>A Medi-Cal variant where the family must spend everything above a set monthly allowance on medical bills before coverage kicks in</td>
</tr>
<tr>
<td><strong>CHIP</strong></td>
<td>Children's Health Insurance Program (1997). Covers children whose families earn too much for Medicaid but have no insurance</td>
</tr>
<tr>
<td><strong>SNAP</strong></td>
<td>Food stamps. Federal benefit, same amount everywhere, but states sign people up (or don't)</td>
</tr>
<tr>
<td><strong>State EITC</strong></td>
<td>Some states add their own Earned Income Tax Credit on top of the federal one, as a percentage of it. California had none when Campbell wrote</td>
</tr>
</tbody>
</table>
</section>

<h2 id="glossary-2-the-ideas-campbell-uses">Glossary 2: the ideas Campbell uses</h2>
<table>
<thead>
<tr>
<th>Concept</th>
<th>Plain meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Less eligibility</strong></td>
<td>A rule from the British poor laws: relief must always be worse than the worst job, or people will choose relief. Campbell says it still organizes American social assistance</td>
</tr>
<tr>
<td><strong>Asset test</strong></td>
<td>To qualify, you must have almost no savings. In California, $3,150 for Dave and Marcella. The test doesn't just screen applicants; it forbids recipients from ever saving</td>
</tr>
<tr>
<td><strong>Phaseout</strong></td>
<td>A benefit that shrinks gradually as you earn more. SSI drops $1 for every $2 earned</td>
</tr>
<tr>
<td><strong>Cliff</strong></td>
<td>A benefit that disappears entirely at one dollar of income. Medicaid and CHIP work this way</td>
</tr>
<tr>
<td><strong>Effective marginal tax rate</strong></td>
<td>Of each extra dollar you earn, the share you lose to taxes <em>plus</em> lost benefits. Campbell's figures: 55 to 80 cents on the dollar for the poor</td>
</tr>
<tr>
<td><strong>Take-up rate</strong></td>
<td>The share of eligible people actually enrolled. Varies by state even when the benefit is federal</td>
</tr>
<tr>
<td><strong>Federal match (FMAP)</strong></td>
<td>For Medicaid, Washington pays part of each state dollar: $2.85 per state dollar in the poorest states, $1.00 in the richest. The state still has to find its dollar</td>
</tr>
<tr>
<td><strong>&quot;Laboratories of democracy&quot;</strong></td>
<td>Justice Brandeis's phrase: states experiment, and good ideas spread. The standard defense of letting states set policy</td>
</tr>
</tbody>
</table>
</section>

<h2 id="the-family-again-from-week-6">The family, again (from Week 6)</h2>
<p><strong>Who they are:</strong> Campbell's brother Dave and sister-in-law Marcella, in Redding, California. In 2012 a car accident left Marcella, then pregnant, a quadriplegic. Their son Logan was born early. Marcella, a nursing student with no work history, landed in <strong>SSI and Medi-Cal</strong>, the bottom tier.</p>
<ul>
<li>Dave kept working. They sold his cars, cashed out her 401(k), and spent down to the <strong>$3,150</strong> asset cap to qualify.</li>
<li>For two years they believed they were in Share of Cost Medi-Cal, which would have taken every dollar Dave earned above a set allowance, so he cut his hours (ch. 2).</li>
<li>Campbell teaches social policy at MIT. She could not navigate the rules for her own family.</li>
</ul>
<div class="point"><b>Why it matters:</b> Chapters 4 and 5 are built on this one case. Chapter 4 asks why the rules that trapped them exist. Chapter 5 asks what would have happened to the same family in Texas, New York, or North Dakota. Keep them in mind; every number on the slides that follow is a number that hit this household.</div>
</section>

<h2 id="campbells-answer-in-advance-chapter-4">Campbell's answer, in advance (chapter 4)</h2>
<p><strong>What she claims:</strong> the features that look &quot;illogical, even cruel&quot; make sense once you see what the programs are for. They were never mainly about ending poverty.</p>
<ol>
<li>Means-tested programs are meant to be &quot;absolutely minimal,&quot; to go to the &quot;deserving,&quot; and above all <strong>not to deter holding a job</strong> (p. 57).</li>
<li>To do that, they must stay worse than the worst job. As low-wage jobs got worse (shrinking wages, part-time work, no employer benefits), the programs &quot;have gotten worse in tandem&quot; (p. 58).</li>
<li>The same design features that keep benefits low and targeted also <strong>block the exit</strong>: leaving for work means losing cash, housing, food aid, child care, and health insurance &quot;one after another&quot; (p. 58).</li>
<li>And nothing on the outside replaces them. Low-wage jobs don't offer child care or insurance or a living wage. &quot;That social assistance traps people in poverty is an indictment, not just of that bottom tier of the American welfare state, but of the entire system&quot; (p. 58).</li>
</ol>
<div class="point"><b>Why it matters:</b> This is a design argument, not a character argument. Whatever the recipient's habits, the rules make work cost more than it pays. Hold that against Monday's reading, where reformers said the problem was <i>dependency</i>.</div>
<p><span class="muted">pp. 57–58</span></p>
</section>

<h2 id="less-eligibility-an-old-rule-still-running">Less eligibility: an old rule still running</h2>
<p><strong>What happened:</strong> The principle comes from the nineteenth-century British poor laws. Workhouses were made worse than the worst outside job so that paupers would choose the job. Campbell says the rule never left.</p>
<ul>
<li>&quot;In contemporary America, this idea persists: means-tested programs have to remain inferior to the alternative—the worst jobs at the worst wages&quot; (p. 57).</li>
<li>If benefits were &quot;easy to get, stigma free, and generous,&quot; employers at the bottom would have to raise pay to find workers. So &quot;policy makers try to make means-tested programs as miserable as possible&quot; (pp. 57–58).</li>
<li>Tight targeting is the tool: low income ceilings <em>and</em> low asset ceilings, so only the very bottom qualifies.</li>
</ul>
<div class="point"><b>Why it matters:</b> Every feature on the next six slides (low benefits, asset tests, cliffs, red tape, stigma) is the same rule applied to a different part of the program. If you understand less eligibility, you can predict the rest.</div>
<p><span class="muted">pp. 57–58</span></p>
</section>

<h2 id="benefits-how-low-can-they-go">Benefits: how low can they go?</h2>
<p><strong>What happened:</strong> Cash benefits are set below the worst wages, which means below the poverty line, everywhere.</p>
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>Most generous TANF state, New York</td>
<td>maximum benefit <strong>less than half</strong> the poverty level</td>
</tr>
<tr>
<td>Least generous, Mississippi</td>
<td><strong>11%</strong> of the poverty level: <strong>$2,040 a year</strong> for a family of three, &quot;a little more than the annual household income in Nigeria&quot;</td>
</tr>
<tr>
<td>TANF plus SNAP, any state</td>
<td>still below the poverty line</td>
</tr>
<tr>
<td>SSI, for the elderly, blind, and disabled</td>
<td>below the poverty line</td>
</tr>
</tbody>
</table>
<ul>
<li>The real value of the minimum wage <em>and</em> of AFDC/TANF benefits both peaked around 1970 and have fallen since (p. 59).</li>
<li>Supply is rationed too. Only <strong>one in four</strong> low-income households gets a rent subsidy. When Chicago opened its public housing list in 2010, <strong>200,000 families</strong> applied; New York's list would take <strong>thirty-eight years</strong> to clear (p. 59).</li>
</ul>
<div class="point"><b>Why it matters:</b> "That antipoverty programs would keep people in poverty makes no sense—until you think about the programs in relation to the job market" (p. 58).</div>
<p><span class="muted">pp. 58–59 · <strong>→ paper</strong></span></p>

<h2 id="asset-tests-you-may-not-save">Asset tests: you may not save</h2>
<p><strong>What happened:</strong> Most means-tested programs in most states require applicants to have almost no savings, and most of those limits haven't been raised in years.</p>
<ul>
<li>The stated purpose is targeting: make sure &quot;no one with a fat bank account is receiving aid&quot; (p. 60). The effect is a &quot;straitjacket&quot; once you're in.</li>
<li>It is expensive to be poor (Ehrenreich's <em>Nickel and Dimed</em>): check-cashing fees, rented furniture, a waitress paying nightly hotel rates because she can't save first and last month's rent (p. 60).</li>
<li>Anthony Wright, Health Access California: &quot;In our social policy, we encourage even poor families to have three months' rent in the bank, even [as] we threaten to take away their health care if they do&quot; (p. 60).</li>
<li><strong>The van.</strong> The wheelchair ramp motor failed; repair, <strong>$3,000</strong>. They aren't allowed to have $3,000. The tax refund arrived that week and went straight out (p. 61).</li>
<li><strong>The car.</strong> Dave needed a car with a back seat for Logan's car seat. A $79-a-month lease would have worked, but leases need about $3,000 down. &quot;That's Dave and Marcella's entire asset limit. If Dave were to lease a car, a social worker would ask: where did he get the money for the down payment?&quot; (pp. 61–62).</li>
</ul>
<div class="point"><b>Why it matters:</b> Savings are what let a family absorb a shock. Children of low-income parents with savings are more mobile later in life than children of low-income parents without (p. 62). The rule makes the next generation poorer too: "not just one asset-poor person but three" (p. 68).</div>
<p><span class="muted">pp. 59–62 · <strong>→ paper</strong></span></p>
</section>

<h2 id="asset-tests-continued-half-the-states-have-dropped-them">Asset tests, continued: half the states have dropped them</h2>
<p><strong>What happened:</strong> The rule is not universal, which is the point of chapter 5. By 2012:</p>
<table>
<thead>
<tr>
<th>Program</th>
<th>States with no asset test</th>
</tr>
</thead>
<tbody>
<tr>
<td>Medicaid</td>
<td><strong>24</strong>, &quot;partly for administrative simplicity and cost savings: it's cheaper simply to cover poor people than to hound them about their assets and then deny care&quot;</td>
</tr>
<tr>
<td>CHIP</td>
<td><strong>47</strong></td>
</tr>
<tr>
<td>TANF</td>
<td>5</td>
</tr>
</tbody>
</table>
<ul>
<li>President Obama's fiscal 2011 budget proposed a <strong>$10,000</strong> floor for federally funded programs (TANF, SNAP, LIHEAP). It &quot;went nowhere&quot; in Congress, and wouldn't have touched state Medicaid rules anyway (p. 62).</li>
<li>The Affordable Care Act drops the Medicaid asset test for the <em>newly</em> eligible. Marcella is in a previously eligible group, the disabled, so California's test still applies to her (p. 62).</li>
</ul>
<div class="point"><b>Why it matters:</b> "If only California would follow the lead of half the states and lift its Medi-Cal asset test, it would make a huge difference in their lives" (p. 62). The trap is a policy choice, and some states have chosen otherwise.</div>
<p><span class="muted">pp. 62, 77, 80, 82</span></p>
</section>

<h2 id="phaseouts-cliffs-and-the-45-cent-dollar">Phaseouts, cliffs, and the 45-cent dollar</h2>
<p><strong>What happened:</strong> As recipients earn more, benefits fall away. Some fade gradually; some vanish at a single dollar. Either way, the next dollar earned is mostly taken back.</p>
<ul>
<li><strong>Phaseout.</strong> SSI recipients can earn <strong>$85 a month</strong> free. Beyond that they lose $1 of SSI per $2 earned, and lose SSI entirely at <strong>$1,097 a month</strong>, just above the poverty line (p. 63).</li>
<li><strong>Cliff.</strong> Medicaid and CHIP: &quot;earn one more dollar in income, and you lose eligibility for public health insurance altogether&quot; (p. 63).</li>
</ul>
<table>
<thead>
<tr>
<th>A single parent with two children goes from $10,000 to $40,000. Of the extra $30,000, the family loses . . .</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>to federal and state taxes alone (payroll tax, smaller EITC)</td>
<td><strong>29%</strong></td>
</tr>
<tr>
<td>if also on SNAP, Medicaid, and CHIP (the programs without waiting lists)</td>
<td><strong>55%</strong></td>
</tr>
<tr>
<td>if also on TANF and housing assistance</td>
<td><strong>80%</strong></td>
</tr>
</tbody>
</table>
<p>&quot;Every additional dollar earned yields only 45 cents, or even as little as 20 cents . . . the highest marginal tax rates faced by anyone in our society&quot; (p. 64).</p>
<div class="point"><b>Why it matters:</b> "Why make the transition from social assistance to work if it means losing the family's Medicaid benefits?" (p. 64). The trap is arithmetic.</div>
<p><span class="muted">pp. 63–64 · <strong>→ paper</strong></span></p>
</section>

<h2 id="why-not-marry-and-what-happened-to-the-mothers-who-left">Why not marry? And what happened to the mothers who left</h2>
<p><strong>What happened:</strong> The same arithmetic punishes marriage, and the one careful study of mothers who left welfare for work found them worse off.</p>
<ul>
<li>Two modest earners who marry can combine their way out of EITC, CHIP, and Medicaid eligibility. Economist Eugene Steuerle: &quot;Not getting married is the major tax shelter for low- and moderate-income households with children&quot; (p. 65).</li>
<li><strong>Edin and Lein</strong> interviewed hundreds of single mothers, some who left welfare for low-wage jobs and some who stayed. The working mothers had higher self-esteem and were slightly less likely to go hungry. They also had <strong>more</strong> housing problems, utility cutoffs, and inadequate winter clothing, were <strong>much more likely to lack medical coverage</strong>, paid more for child care and transportation, and saw their children less (p. 65).</li>
<li>That fieldwork predates 1996. Since then &quot;many single mothers no longer have the choice of staying at home: they have to get jobs in order to get welfare,&quot; and they face the same costs (p. 65).</li>
</ul>
<div class="point"><b>Why it matters:</b> Monday's reading said "work first" moved more people into jobs than training did. Campbell's question is what those jobs cost the family once the benefits fell away. Both claims can be true. Your paper can hold them against each other.</div>
<p><span class="muted">pp. 64–65 · <strong>→ paper</strong></span></p>
</section>

<h2 id="the-100-percent-tax-and-the-two-rules-nobody-mentions">The 100 percent tax, and the two rules nobody mentions</h2>
<p><strong>What happened:</strong> Share of Cost Medi-Cal takes every dollar above a small allowance, and when the arithmetic isn't enough, red tape and stigma finish the job.</p>
<ul>
<li><strong>Share of cost.</strong> Above the allowed living amount, &quot;they must pay all their remaining income in share of cost. And if they make more money, their share of cost simply increases, dollar for dollar: a 100 percent tax.&quot; Dave &quot;dial[ed] down his . . . work hours&quot; while the family (wrongly) believed it was in that program (p. 66).</li>
<li><strong>Red tape.</strong> Marcella, a &quot;deserving&quot; beneficiary, has fought for every benefit. &quot;If she were a TANF mom, she could face fingerprinting, intrusive questions about her sexual history, and drug testing before getting benefits&quot; (p. 66).</li>
<li><strong>Stigma.</strong> The design goal is to make applying &quot;so unpalatable that people will stomach any alternative, including a low-wage job, even if it is economically inferior. That so many of the eligible don't even try to sign up shows how effective stigma is&quot; (p. 66).</li>
</ul>
<div class="point"><b>Why it matters:</b> Week 6's Desmond chapter said the poor avoid welfare rather than depend on it. Campbell gives the mechanism: avoidance is what the hurdles are for. "In the perverse world of means-tested programs, work doesn't pay" (p. 66).</div>
<p><span class="muted">p. 66</span></p>
</section>

<h2 id="the-poverty-trap-and-its-perversities">The poverty trap and its perversities</h2>
<p><strong>What happened:</strong> Campbell turns the &quot;cycle of poverty&quot; argument around. The cycle is real, and the programs build it.</p>
<ul>
<li>The disabled face an &quot;extreme choice&quot; (Medicaid expert Tony Dreyfus): work and lose Medicaid and SSI, or &quot;remain poor&quot; and keep them. Many &quot;dare not&quot; work (pp. 66–67).</li>
<li>&quot;What's perverse is that policy makers rail against a 'cycle of poverty,' but then design programs that create a cycle of poverty&quot; (p. 67).</li>
<li>The old debate: is poverty caused by a &quot;culture of poverty&quot; (helplessness, dependence) or by the system? Conservative writer Stuart Butler blames the &quot;stickiness&quot; of parents' habits: thrift, honesty, perseverance (p. 67).</li>
<li>Campbell's reply: &quot;an examination of policy design suggests high systemic barriers no matter what an individual's personal traits are&quot; (p. 67).</li>
<li>The programs &quot;induce people to work less,&quot; &quot;lead people to get divorced or never to marry,&quot; and bar extended families from helping financially, &quot;in ways that would appear to violate conservatives' concerns about the work ethic and family values&quot; (p. 68).</li>
</ul>
<div class="point"><b>Why it matters:</b> This is the hinge between Monday and today. Monday's reformers renamed the problem <i>dependency</i>, a trait of recipients. Campbell says the dependency is manufactured by the rules. Same evidence, opposite diagnosis. Which one does the film support?</div>
<p><span class="muted">pp. 66–68 · <strong>→ paper</strong></span></p>
</section>

<h2 id="what-can-be-done">What can be done</h2>
<p><strong>What happened:</strong> Campbell rejects abolition (&quot;they've gotten their wish with regard to TANF. It is now such a small program . . . that it's a minor part of social assistance,&quot; p. 68) and offers three repairs.</p>
<ol>
<li><strong>Redesign the programs.</strong> Steuerle's &quot;integrated approach&quot;: set tax and benefit rules together, make the hidden tax rates visible, and cap the effective marginal rate so the fall-off is gentler. Lift or end asset limits (p. 68).</li>
<li><strong>Improve low-wage jobs.</strong> Higher state and local minimum wages; ACA tax breaks for small employers who insure. But &quot;it simply may not be economically feasible for low-wage employers to offer more benefits. Strong public programs are needed&quot; (p. 68).</li>
<li><strong>Build universal programs</strong> (Theda Skocpol's model: public schools, Social Security, the G.I. Bill). Universal child care and preschool, paid family leave, health insurance, and, Campbell adds, <strong>social insurance for long-term care</strong>, &quot;so that the disabled of any age don't have to impoverish themselves to get assistance&quot; (p. 69). No cliffs, no stigma, and middle-class support.</li>
</ol>
<p>California's paid family leave is her example: funded by a payroll tax on everyone, it &quot;has most benefited low-wage workers,&quot; whose employers never offered leave (p. 69).</p>
<div class="point"><b>Why it matters:</b> Each fix attacks a different wall of the trap: the program's exit rules, the job on the other side, or the gap between them. A paper that names the wall is stronger than one that says "the system fails."</div>
<p><span class="muted">pp. 68–69</span></p>
</section>

<h2 id="campbells-answer-in-advance-chapter-5">Campbell's answer, in advance (chapter 5)</h2>
<p><strong>What she claims:</strong> Social Security and Medicare are the same in every state. Social assistance is not, and the variation is enormous, old, and hard to defend.</p>
<ol>
<li>The variation comes from <strong>the founding</strong>: southern members of Congress kept cash aid for the poor under state control to protect a labor system built on Black farm workers. The structure outlived the motive (pp. 72–75).</li>
<li>It shows up in <strong>every program</strong>: whether a state has it, who qualifies, what counts as income and assets, how much it pays, who signs up (pp. 75–86).</li>
<li>The modern defenses of state control (<strong>responsiveness, innovation, efficiency, choice</strong>) hold for roads and business policy. For social assistance, each fails on contact with the evidence (pp. 90–97).</li>
<li>Washington has slowly <strong>centralized</strong> the programs for working families, but not the ones for nonworkers (pp. 97–99).</li>
</ol>
<div class="point"><b>Why it matters:</b> "In sum, a person's public policy experience is a sheer accident of geography. Is that just?" (p. 72). Monday's chapter showed AFDC paying 16% of poverty in Louisiana and 89% in Alaska. This chapter says that was never only AFDC.</div>
<p><span class="muted">pp. 71–72</span></p>
</section>

<h2 id="1935-why-the-poor-got-fifty-programs-and-the-old-got-one">1935: why the poor got fifty programs and the old got one</h2>
<p><strong>What happened:</strong> Before the New Deal, states ran their own relief, including mothers' pensions, and used them selectively. The Social Security Act kept that arrangement for the poor.</p>
<ul>
<li>Southern states withheld mothers' pensions in &quot;counties with the highest concentrations of African Americans in order to maximize the number of available workers&quot; (p. 73).</li>
<li>Federal cash to Black farm workers and domestics &quot;outside the control of the white planter elite&quot; threatened the South's economy. Southern committee chairs responded two ways (p. 73).</li>
<li><strong>Social insurance</strong> (Old Age Insurance, Unemployment Insurance) covered only &quot;commerce and industry,&quot; excluding farm and domestic labor. That exclusion faded as occupations were added; by the 1970s Social Security was nearly universal (p. 73).</li>
<li><strong>Social assistance</strong> (Old Age Assistance, Aid to Dependent Children) was left to the states: federal money, state rules on eligibility and benefits. A clause promising &quot;a reasonable subsistence compatible with decency and health&quot; was stripped out (p. 74).</li>
<li>1965 repeated the split: <strong>Medicare</strong> federal and uniform; <strong>Medicaid</strong> federal-state, with states setting scope, eligibility beyond the minimum, and provider payments, and paying part of the bill (pp. 74–75).</li>
</ul>
<div class="point"><b>Why it matters:</b> Old Age Assistance was federalized as SSI in 1972. ADC never was. "To this day, means-tested social assistance programs bear the marks of their birth in the crucible of American racial politics and states' rights" (p. 75). Fiscal capacity and ideology now do the work the planters once did.</div>
<p><span class="muted">pp. 72–75 · <strong>→ paper</strong></span></p>
</section>

<h2 id="tanf-four-in-five-poor-children-then-and-now">TANF: four in five poor children, then and now</h2>
<p><strong>What happened:</strong> &quot;Forty years ago, four in five poor children received welfare; now four in five poor children do not&quot; (p. 75). Behind the national decline is a fifty-way spread.</p>
<table>
<thead>
<tr>
<th>Share of poor children on AFDC/TANF, 2009 (fig. 5.1)</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>California, Maine</td>
<td><strong>above 50%</strong></td>
</tr>
<tr>
<td>Washington, Hawaii, Massachusetts</td>
<td>above 40%</td>
</tr>
<tr>
<td>Twelve states, from Florida to Idaho, Texas and Mississippi among them</td>
<td><strong>below 10%</strong></td>
</tr>
</tbody>
</table>
<table>
<thead>
<tr>
<th>Maximum monthly TANF benefit, family of three, July 2011 (fig. 5.2)</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>New York · California · Vermont</td>
<td>$788 · $714 · $640</td>
</tr>
<tr>
<td>Tennessee · Mississippi</td>
<td><strong>$185 · $170</strong></td>
</tr>
</tbody>
</table>
<p>In 22 states the maximum is under a quarter of the poverty line; at the bottom, &quot;$2 per day—the World Bank's definition of poverty in developing countries&quot; (p. 77). Adjusting for cost of living (fig. 5.3) leaves the same states at the bottom.</p>
<div class="point"><b>Why it matters:</b> Nearly every state covered fewer poor children in 2009 than in 1969. Monday's "fewer people on welfare" is a national figure; in a dozen states it means fewer than one poor child in ten gets cash aid.</div>
<p><span class="muted">pp. 75–77 · <strong>→ paper</strong></span></p>

<h2 id="tanf-continued-the-rules-change-at-the-state-line">TANF, continued: the rules change at the state line</h2>
<p><strong>What happened:</strong> Beyond benefit levels, every rule that decides who gets in and who gets thrown out is a state choice.</p>
<ul>
<li><strong>Asset limits:</strong> five states have none. Elsewhere, from <strong>$1,000</strong> (Georgia, Texas, Washington) to <strong>$10,000</strong> (Delaware), typically $2,000 or $3,000. Some exempt one car, some all cars (p. 77).</li>
<li><strong>Diversion:</strong> some states hand applicants a one-time lump sum and bar them from TANF for months afterward (p. 78).</li>
<li><strong>Whose income counts:</strong> a stepparent's in Iowa but not Kansas; a grandparent's in New Hampshire but not Vermont (p. 79).</li>
<li><strong>Job search before you apply:</strong> required in Idaho, not in Montana (p. 79).</li>
<li><strong>Sanctions:</strong> in Mississippi, the top penalty for missing a work requirement is &quot;total loss of benefits and permanent ineligibility.&quot; In Arkansas, the case closes until the family complies for two weeks (p. 79).</li>
<li>A family with <strong>$2,000</strong> in assets qualifies in Oregon and not in Washington (p. 79).</li>
</ul>
<div class="point"><b>Why it matters:</b> "A family's experience depends entirely on the state in which it happens to live" (p. 79). When the film's families (in Wisconsin) hit a rule, ask whether the rule is Wisconsin's or the country's.</div>
<p><span class="muted">pp. 77–79</span></p>
</section>

<h2 id="medicaid-does-health-care-vary-less-the-answer-is-no">Medicaid: does health care vary less? &quot;The answer is no&quot;</h2>
<p><strong>What happened:</strong> Americans think of health care as closer to a right than cash is. Campbell asks whether Medicaid rules are therefore more uniform. &quot;The answer is no, for the most part&quot; (p. 79).</p>
<ul>
<li><strong>Federal floor:</strong> pregnant women and children under six below 133% of poverty; children six to eighteen below 100%. Beyond that, states choose (p. 79).</li>
<li><strong>Children:</strong> all but four states cover kids to 200% of poverty through Medicaid or CHIP (p. 79).</li>
<li><strong>Adults:</strong> in 2013, <strong>18 states</strong> covered working parents above the poverty line; <strong>16 states</strong> cut parents off below <em>half</em> of it. The ACA's 138% rule became optional after the Supreme Court ruling, so childless adults qualify in some states and not others (p. 80).</li>
<li><strong>Assets:</strong> 24 states, no test. Among the 26 with one, most cap at $2,000–$3,000; the range is $1,000 to $30,000 (fig. 5.4). Some count 529 and retirement savings, some don't (pp. 80–81).</li>
<li><strong>Benefits:</strong> every state covers prescriptions, but Washington pays for two a month and Louisiana eight. Adult dental, glasses, physical therapy, hospice: optional (p. 81).</li>
</ul>
<div class="point"><b>Why it matters:</b> Poorer states get a bigger federal match, <b>$2.85</b> per state dollar versus <b>$1.00</b> in the richest, "but getting the federal match still means spending a state dollar, which poor states are less likely to have" (p. 81). The formula narrows the gap and doesn't close it.</div>
<p><span class="muted">pp. 79–81 · <strong>→ paper</strong></span></p>
</section>

<h2 id="medicaid-continued-and-on-and-absurdly-on">Medicaid, continued: &quot;And on and absurdly on&quot;</h2>
<p><strong>What happened:</strong> Campbell lines up pairs of states to show that the same person, with the same income, is covered on one side of a border and not the other.</p>
<table>
<thead>
<tr>
<th>The same person . . .</th>
<th>Covered in</th>
<th>Not in</th>
</tr>
</thead>
<tbody>
<tr>
<td>in a required group, with $2,500 in assets</td>
<td>California</td>
<td>Nevada</td>
</tr>
<tr>
<td>with $5,000 in assets</td>
<td>Minnesota</td>
<td>Michigan</td>
</tr>
<tr>
<td>pregnant, at 150% of poverty</td>
<td>Georgia</td>
<td>Alabama</td>
</tr>
<tr>
<td>pregnant, at 200% of poverty</td>
<td>New Mexico</td>
<td>Arizona</td>
</tr>
<tr>
<td>working parent of a Medicaid child</td>
<td>Wisconsin, up to <strong>200%</strong> of poverty</td>
<td>Arkansas, above <strong>16%</strong> of poverty (&quot;Nigeria-level income&quot;)</td>
</tr>
<tr>
<td>an adult who needs glasses</td>
<td>Texas</td>
<td>Oklahoma</td>
</tr>
</tbody>
</table>
<p>In a Massachusetts Medicaid family, &quot;a child can get a filling in any tooth, but his mom can get a filling only in her twelve front teeth, not in her molars.&quot; From 2010 to 2012 budget cuts ended most adult dental coverage altogether (p. 82).</p>
<div class="point"><b>Why it matters:</b> "As with TANF, how you fare is an accident of time and place" (p. 82). None of these differences track need. They track the state's budget and its politics.</div>
<p><span class="muted">pp. 81–82</span></p>

<h2 id="chip-a-1997-program-with-1935-habits">CHIP: a 1997 program with 1935 habits</h2>
<p><strong>What happened:</strong> CHIP was built in 1997, long after the racial politics of the founding. Campbell asks whether a &quot;modern&quot; program escaped the pattern. &quot;And yet it does&quot; vary, just as much.</p>
<ul>
<li>Funded jointly, with the Medicaid match plus a 15% &quot;sweetener&quot; to get states to join. States set eligibility (p. 82).</li>
<li>By 2012, 47 states had dropped the asset test, but income cutoffs run from <strong>160%</strong> of poverty (North Dakota) to <strong>400%</strong> (New York), a spread far wider than cost-of-living differences (pp. 82–83).</li>
<li>A child in a <strong>$40,000</strong> household: eligible in Tennessee, not Kentucky. <strong>$50,000</strong>: Connecticut yes, Rhode Island no. <strong>$35,000</strong>: South Dakota yes, North Dakota no (p. 83).</li>
<li>Arizona closed CHIP to new enrollment in December 2009. &quot;What happens to the Logans of Arizona?&quot; (p. 83).</li>
<li><strong>38 states</strong> impose a waiting period of one to twelve months of being uninsured before a child can enroll, to stop parents from dropping employer coverage. &quot;There is little evidence that parents engage in such behavior&quot; (p. 83).</li>
</ul>
<div class="point"><b>Why it matters:</b> "Imagine if Logan were born in a state with a twelve-month waiting period. Is he supposed to go without medical care or checkups for the first year of his life?" (p. 83). The structure, not the era, produces the variation.</div>
<p><span class="muted">pp. 82–83</span></p>
</section>

<h2 id="state-eitcs-and-ssi-supplements-the-same-family-different-checks">State EITCs and SSI supplements: the same family, different checks</h2>
<p><strong>What happened:</strong> Two programs where the federal benefit is uniform and the state add-on is not.</p>
<ul>
<li><strong>State EITC.</strong> The federal credit dates from 1975; Maryland added the first state credit in 1987; by 2011, 23 states and DC had one, set at <strong>3.5% to 40%</strong> of the federal credit (pp. 83–84).</li>
<li>Dave and Marcella's 2012 federal EITC was <strong>$3,200</strong>. On top of that they would have gotten <strong>$1,280</strong> in DC, <strong>$1,056</strong> in Minnesota, <strong>$320</strong> in Washington, <strong>$192</strong> in Oregon. In California: <strong>nothing</strong> (p. 84).</li>
<li><strong>SSI supplement.</strong> Most states add to the federal check (not Arizona, North Dakota, Mississippi, West Virginia). For a recipient living independently: <strong>$10</strong> a month in Maine, <strong>$14</strong> in Michigan, <strong>$168</strong> in Connecticut (p. 84).</li>
<li><strong>California's trade.</strong> It is the only state that bars SSI recipients from food stamps, adding cash instead. In 2012 a disabled Californian got <strong>$854</strong> a month; in Massachusetts, <strong>$812</strong> plus SNAP, for <strong>$944</strong>. California's &quot;generosity&quot; leaves its disabled <strong>$1,080 a year</strong> poorer (p. 85).</li>
</ul>
<div class="point"><b>Why it matters:</b> "Not only does access to means-tested programs vary, but so does the take-home pay of lower-wage workers, all because of differences in state policies" (p. 84). The variation reaches the paycheck, not only the welfare office.</div>
<p><span class="muted">pp. 83–85</span></p>
</section>

<p><strong>What happened:</strong> Food stamps pay the same amount in every state. Enrollment still varies, because state and county workers are the ones who sign people up, or don't.</p>

<h2 id="tennessee-the-underground-railroad-out-of-the-nursing-home">Tennessee: the underground railroad out of the nursing home</h2>
<p><strong>What happened:</strong> In the stingiest states, &quot;where you live&quot; decides not how much help you get but whether you get to live at home.</p>
<ul>
<li>Tennessee's nursing home lobby meant that a disabled person without family or money could get personal care only by living in a nursing home. In <strong>2005</strong>, <strong>97%</strong> of Tennesseans getting long-term supports were in nursing homes; <strong>3%</strong> in the community, &quot;the absolute bottom&quot; nationally (pp. 88–89).</li>
<li>After decades of sit-ins (&quot;Our Homes, Not Nursing Homes&quot;), the state began funding in-home care in 2010. The nursing-home share fell to <strong>67%</strong> by 2013 (p. 89).</li>
<li>Beginning in the early 1990s, the Memphis Center for Independent Living bought <strong>one-way plane tickets</strong> to Denver, where the disability group ADAPT met residents and set them up in apartments. At least sixteen people left this way, including three CIL staff. One nursing home director threatened to have the state police bring a resident back and charge his friends with kidnapping (pp. 89–90).</li>
<li>Campbell: &quot;It's like the movie <em>Argo</em>, except the hostages are trying to escape American nursing homes&quot; (p. 90).</li>
</ul>
<div class="point"><b>Why it matters:</b> A reader can dismiss benefit tables as abstractions. This is what a $0 line in a state budget does to a person. Even after reform, one client who inherited a small sum lost her care for three months and got it back for six days a week, "as if 'magically she doesn't need services on Sunday'" (p. 89).</div>
<p><span class="muted">pp. 88–90</span></p>
</section>

<h2 id="the-case-for-state-control-stated-fairly">The case for state control, stated fairly</h2>
<p><strong>What happened:</strong> Before knocking it down, Campbell gives the standard argument for letting states set social policy.</p>
<ul>
<li>The federal structure gives states their own taxing and spending powers, and the social legislation gave them rule-setting powers. The result is &quot;fifty different worlds of social assistance&quot; (p. 90).</li>
<li>The defense is a market analogy. People and firms are mobile and choose where to live. States compete for them. Competition produces <strong>responsiveness</strong> to local preferences, <strong>innovation</strong> in policy, and <strong>efficiency</strong> in spending, the way consumer choice disciplines businesses (pp. 90–91).</li>
<li>Campbell grants the argument where it fits: economic development (infrastructure, job training, business incentives) and divisive moral questions (abortion, same-sex marriage), where letting states differ is &quot;attractive&quot; (p. 91).</li>
<li>&quot;But what about social policy? Do these arguments hold up in this policy arena as well?&quot; (p. 91).</li>
</ul>
<div class="point"><b>Why it matters:</b> The next four slides take the four promises one at a time: responsiveness, innovation, efficiency, choice. A good paper does the same thing with its claim. State the strongest version, then test it.</div>
<p><span class="muted">pp. 90–91</span></p>
</section>

<h2 id="responsiveness-the-states-that-need-the-most-do-the-least">Responsiveness: the states that need the most do the least</h2>
<p><strong>What happened:</strong> If states responded to need, poor states would spend more on the poor and all states would spend more in recessions. &quot;In reality, the exact opposite patterns emerge&quot; (p. 92).</p>
<ul>
<li>Across states there is a <strong>negative</strong> relationship between need and provision. Poor states spend less; so do conservative states (p. 92).</li>
<li>The Medicaid match uses per capita income, which tracks need loosely. New York and Massachusetts have the same per capita income and the same match; New York's poverty rate is <strong>60% higher</strong>. Mississippi, Louisiana, and New Mexico have higher poverty than other low-income states and get no extra (p. 92).</li>
<li>Over time: nearly every state must balance its budget, so in downturns they cut. In the Great Recession, <strong>Arizona</strong> closed CHIP and cut the TANF time limit from 60 months to 36; <strong>Massachusetts</strong> ended adult dental; <strong>Washington</strong> cut disability grants; <strong>Pennsylvania</strong> cut its SSI supplement; <strong>Mississippi</strong> cut mental health; <strong>South Carolina</strong> cut Medicaid hospital payments 7% and physician payments 10% (pp. 92–93).</li>
<li>&quot;Such reductions reinforce downturns, making recessions even worse, whereas policy responsiveness would dictate greater, countercyclical spending&quot; (p. 93).</li>
</ul>
<div class="point"><b>Why it matters:</b> "That the same people get different amounts of help depending on their location is the opposite of responsiveness" (p. 93). Monday's chapter ended with TANF rolls rising 13% while unemployment doubled in 2008. Here is the state-level half of that story.</div>
<p><span class="muted">pp. 91–93 · <strong>→ paper</strong></span></p>
</section>

<h2 id="innovation-real-and-uneven">Innovation: real, and uneven</h2>
<p><strong>What happened:</strong> This is the one argument Campbell partly concedes. States do invent things that spread. They also invent things that go sour, and they let good rules rot.</p>
<ul>
<li><strong>Spread:</strong> Massachusetts's 2006 health reform became the ACA's template. New Jersey's hospital payment system (DRGs) was adopted by Medicare. California and New Jersey pioneered paid family leave. States moved Medicaid long-term care money toward home care, which &quot;most people prefer&quot; (pp. 93–94).</li>
<li><strong>Soured:</strong> prison privatization cut costs and raised understaffing and violence. California's swap of food stamps for a bigger SSI check became &quot;effectively . . . a benefit reduction&quot; as the supplement fell behind the value of SNAP (p. 94). Massachusetts disability advocates fear an ACA demonstration that pays one managed-care company for both Medicare and Medicaid will cut personal-care hours (p. 94).</li>
<li><strong>Rot:</strong> California's Medi-Cal asset limit &quot;hasn't been adjusted since 1989 and is now worth half as much in real terms&quot; (p. 95).</li>
</ul>
<div class="point"><b>Why it matters:</b> "Innovation is desirable but uneven, across states, across time, and across programs, to the detriment of program beneficiaries" (p. 95). Monday's waivers were innovation too: Wisconsin's experiment became the national law. Campbell's point is that nothing guarantees the experiment that spreads is the one that worked.</div>
<p><span class="muted">pp. 93–95</span></p>
</section>

<h2 id="efficiency-cheap-now-expensive-later">Efficiency: cheap now, expensive later</h2>
<p><strong>What happened:</strong> Competition is supposed to make states spend wisely. In social assistance it pushes them to spend less, and the bill comes due somewhere else.</p>
<ul>
<li>Interstate competition &quot;may simply induce states to develop less redistributive policy in order to keep taxes low,&quot; saving today and costing tomorrow (p. 95).</li>
<li>Low Medicaid payments to doctors save money until patients can't find a doctor and go to the emergency room. In Kentucky, which hadn't raised payments in ten years, the incoming president of the state medical association had cut his own Medicaid patients from 25% to 15%: &quot;it's difficult to run a practice if you aren't getting reimbursed&quot; (p. 95). States that spend less on Medicaid get worse access and worse health (p. 95).</li>
<li>Medi-Cal is &quot;a particularly low payer&quot;: spending per child was <strong>two-thirds</strong> of the national average in 2009. Marcella waits months for specialists and never saw one for her vocal cord injury. Dave: &quot;As Medi-Cal patients, we're last on the wait list&quot; (p. 96).</li>
<li>Four months after rehab, Medi-Cal stopped paying for the mattress topper that prevents pressure sores in quadriplegics because she &quot;didn't have enough bed sores.&quot; &quot;Maybe next time she will, costing Medi-Cal far more&quot; (p. 96).</li>
</ul>
<div class="point"><b>Why it matters:</b> Efficiency means more output per dollar. A policy that produces an emergency-room visit instead of a clinic visit, or surgery instead of a mattress, is the opposite. The savings are real and the costs are real; they land in different budgets.</div>
<p><span class="muted">pp. 95–96 · <strong>→ paper</strong></span></p>
</section>

<h2 id="choice-who-actually-gets-to-move">Choice: who actually gets to move?</h2>
<p><strong>What happened:</strong> The whole case for state variation rests on people choosing where to live. Campbell asks who can.</p>
<ul>
<li>State lawmakers fear becoming a <strong>&quot;welfare magnet&quot;</strong> and hold benefits down. The research on whether magnets exist is &quot;inconclusive,&quot; but &quot;what matters is that state lawmakers think the effect exists, and make policy accordingly&quot; (p. 96).</li>
<li>A study of poor single mothers found benefit levels did influence moves &quot;somewhat,&quot; but &quot;many move back to their home state, where their family network and connections are&quot; (p. 96).</li>
<li>Dave and Marcella, on paper, should move to a state without an asset test, or to Massachusetts for its hospitals and disability services. They won't. Dave has lived his whole life in Redding; Marcella's family is there; friends rebuilt their house for a wheelchair. &quot;No state will pay for wheelchair renovations. . . . No state will pay for twenty-four-hour coverage&quot; (p. 97).</li>
<li>&quot;Dave and Marcella have no 'choice.' They have to remain where they have access to the crucial network of family and lifelong friends&quot; (p. 97).</li>
</ul>
<div class="point"><b>Why it matters:</b> The market analogy assumes a mobile customer. The people who most need the programs are the least able to shop for a state, because the unpaid care that keeps them alive is where their family is. In the film, ask whether either household could leave Milwaukee.</div>
<p><span class="muted">pp. 96–97 · <strong>→ paper</strong></span></p>
</section>

<h2 id="centralization-is-happening-for-the-working-poor">Centralization is happening, for the working poor</h2>
<p><strong>What happened:</strong> Over thirty years Washington has quietly taken a bigger role, which Campbell reads as &quot;an at least tacit recognition that state variation in this area is neither effective nor desirable&quot; (p. 98).</p>
<ul>
<li>The national interest: an adult uninsured at 40 because of a stingy state becomes a costlier <strong>Medicare</strong> patient at 65. And the Constitution charges the national government with &quot;the general welfare&quot; (p. 98).</li>
<li><strong>EITC and SNAP</strong>, mostly federal, have expanded, offsetting state decline elsewhere. <strong>Medicaid</strong> has had group after group added to its mandatory list since the 1980s; the ACA pays 100% of expansion costs, falling to 90%. <strong>CHIP</strong>'s 2009 reauthorization raised the tobacco tax, made states use their money or lose it, and pays bonuses for beating enrollment targets (pp. 98–99).</li>
<li>The catch: &quot;much of the new federal help has been aimed at jobholders rather than nonworkers.&quot; EITC and CHIP target the working poor by design. &quot;Programs that substantially benefit nonworkers, such as TANF and public housing, have been static or shrinking . . . a policy backwater of low funding and pronounced cross-state variation&quot; (p. 99).</li>
</ul>
<div class="point"><b>Why it matters:</b> Monday's chapter traced the same line: the EITC for the working poor grew while AFDC for the non-working poor was abolished. Campbell shows the line runs through federalism too. The programs Washington took over are the ones for people with jobs.</div>
<p><span class="muted">pp. 97–99 · <strong>→ paper</strong></span></p>
</section>

<h2 id="the-answer-how-you-fare-depends-on-where-you-sit">The answer: how you fare depends on where you sit</h2>
<table>
<thead>
<tr>
<th>Promise of state control</th>
<th>What Campbell finds</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Responsiveness</strong></td>
<td>Poor states spend least; all states cut in recessions. The same person gets different help by zip code</td>
</tr>
<tr>
<td><strong>Innovation</strong></td>
<td>Real (Massachusetts → ACA, DRGs, paid leave) but uneven, sometimes harmful, and old rules rot (a 1989 asset cap)</td>
</tr>
<tr>
<td><strong>Efficiency</strong></td>
<td>Low payments shift costs to emergency rooms, surgery, and Medicare later</td>
</tr>
<tr>
<td><strong>Choice</strong></td>
<td>Lawmakers fear magnets; the poor move toward family, not benefits. Dave and Marcella cannot leave</td>
</tr>
</tbody>
</table>
<p>The variation is easy to explain: &quot;low-income states can afford to do less for the poor,&quot; and conservative states choose to. It is &quot;hard to defend, either economically or morally&quot; (pp. 99–100).</p>
<div class="point"><b>The chapter in one sentence:</b> "Morally, it's difficult to say that the same poor person should have health insurance in Minnesota but not in Texas. Or that the same disabled person should have ten hours of personal care per day in North Dakota but none at all in Tennessee. . . . Americans are citizens of the nation, yet the meaning of that citizenship varies tremendously depending on where they live within the country" (p. 100).</div>
<p><span class="muted">pp. 99–100 · <strong>→ paper</strong></span></p>
</section>

<h2 id="rank-ch-13-the-welfare-state-is-minimal">Rank ch. 13: the welfare state is minimal</h2>
<p><strong>What they claim:</strong> Americans overestimate what welfare costs. The non-health programs for the poor are a rounding error in the economy, and spending on poor children has fallen.</p>
<table>
<thead>
<tr>
<th>Spending</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>Federal low-income programs outside health care, 2018</td>
<td><strong>2% of GDP</strong>, &quot;2 cents for every dollar the economy produced&quot;</td>
</tr>
<tr>
<td>Same programs as a share of the federal budget, 2019</td>
<td><strong>8%</strong> ($361 billion)</td>
</tr>
<tr>
<td>Health programs, 2019</td>
<td>25% of the budget ($1.1 trillion), but <strong>three-fifths of that is Medicare</strong>, not programs for the poor</td>
</tr>
<tr>
<td>Federal spending per child in a family with no paid work</td>
<td><strong>$8,700</strong> in 1990 → <strong>$7,000</strong> in 2015 (inflation-adjusted)</td>
</tr>
</tbody>
</table>
<ul>
<li>Against peer countries, the U.S. has higher poverty and inequality and spends less on the safety net (fig. 13.2). The authors call the result &quot;iconically unequal.&quot;</li>
</ul>
<div class="point"><b>Why it matters:</b> When a politician says welfare is bankrupting the country, this is the denominator. The programs for the poor that aren't health care are two cents on the dollar, and Medicare, a program for the old, is most of the health number.</div>
<p><span class="muted">Rank et al., ch. 13 · <strong>→ paper</strong></span></p>

<h2 id="rank-ch-13-continued-tanf-falling-further-behind">Rank ch. 13, continued: TANF, &quot;Falling Further Behind&quot;</h2>
<p><strong>What they claim:</strong> Welfare reform made a small program smaller, and the shrinkage is not race-neutral.</p>
<table>
<thead>
<tr>
<th>TANF since 1996</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>Families on the rolls</td>
<td>4.4 million (1996) → <strong>1.3 million</strong> (2017)</td>
</tr>
<tr>
<td>Poor families served, per 100 in poverty</td>
<td>68 (1996) → <strong>23</strong> (2017)</td>
</tr>
<tr>
<td>Benefit for a family of three, median state, 2018</td>
<td><strong>$486 a month</strong>; under $300 in 14 states; at or below 20% of poverty in 17 states</td>
</tr>
<tr>
<td>Had TANF kept its 1996 reach</td>
<td><strong>3.8 million</strong> families served in 2017, not 1.3 million</td>
</tr>
</tbody>
</table>
<ul>
<li>TANF is &quot;work-first,&quot; aimed at &quot;ending the dependence of needy parents on government benefits&quot; rather than ending poverty. Block grants have been frozen since 1997, with no inflation adjustment.</li>
<li>Heather Hahn and colleagues: the larger a state's Black population, the lower its TANF benefits, the stricter its rules, and the shorter its time limits. Vermont served <strong>78</strong> of every 100 poor families; Mississippi, <strong>10</strong>.</li>
</ul>
<div class="point"><b>Why it matters:</b> Here is Monday's 84%-to-40% and Campbell's Mississippi check with national data, plus the finding the other two readings only gesture at: the fifty worlds are sorted by race. Gilens (Week 12) gives this chapter's expert appraisal.</div>
<p><span class="muted">Rank et al., ch. 13 · <strong>→ paper</strong></span></p>

<h2 id="rank-ch-13-continued-does-generosity-kill-work">Rank ch. 13, continued: does generosity kill work?</h2>
<p><strong>What they claim:</strong> The standard argument for keeping benefits low is that higher benefits would discourage work. The authors say the evidence runs the other way.</p>
<ul>
<li>Kjetil van der Wel and Knut Halvorsen, 18 European countries: &quot;commitment to employment increased as social spending grew more generous.&quot;</li>
<li>Abhijit Banerjee, cash transfer programs in six developing countries: &quot;no evidence that they discouraged work.&quot;</li>
<li>The programs that exist have worked where they reach: Social Security, food assistance, and tax credits for working families &quot;have reduced the poverty rate by half since 1967.&quot;</li>
<li>Only <strong>3%</strong> of single mothers with two children earning under 150% of poverty get the full stack of EITC, SNAP, and TANF or housing aid. The &quot;multiple programs&quot; household is rare.</li>
</ul>
<div class="point"><b>Why it matters:</b> Campbell showed that work doesn't pay because benefits vanish as earnings rise. Rank and colleagues add the cross-national finding: where benefits are higher and don't vanish, people work <i>more</i>. Both say the disincentive is in the phaseout, not in the generosity. Monday's reformers assumed the opposite.</div>
<p><span class="muted">Rank et al., ch. 13, &quot;Conclusion&quot; · <strong>→ paper</strong></span></p>

<h2 id="rank-ch-14-fraud-is-scarce">Rank ch. 14: fraud is scarce</h2>
<p><strong>What they claim:</strong> Fraud by recipients is rare and well measured. The authors use SNAP, the most scrutinized program, because it is the one the fraud stories are told about.</p>
<table>
<thead>
<tr>
<th>SNAP</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>Average benefit, 2018</td>
<td><strong>$127 a month: $4.17 a day, $1.39 a meal</strong></td>
</tr>
<tr>
<td>Recipients who are seniors, children, or disabled</td>
<td><strong>two-thirds</strong></td>
</tr>
<tr>
<td>Households with a recipient found to have committed fraud, 2016</td>
<td><strong>14 in 10,000</strong>; recipient <em>error</em>, 181 in 10,000</td>
</tr>
<tr>
<td>Dollars overpaid through recipient fraud</td>
<td><strong>$11 per $10,000</strong>; through recipient error, $63. The IRS estimates <strong>$1 of every $6</strong> in federal taxes owed goes unpaid</td>
</tr>
<tr>
<td>Benefits trafficked for cash, 2012–14</td>
<td>1.5% ($1.1 billion of about $73 billion), mostly by retailers; fewer than 1% of stores disqualified</td>
</tr>
<tr>
<td>Overpayment dollars that were the state agency's fault</td>
<td>almost <strong>60%</strong> (Stacy Dean, congressional testimony)</td>

<div class="point"><b>Why it matters:</b> Reagan's 1976 "welfare queen" (a hundred and twenty-seven names, fifty Social Security numbers, three new cars) and Fox News's "food stamp surfer" Jason Greenslate are the same move: one case made to stand for millions. The table is what the millions look like.</div>
<p><span class="muted">Rank et al., ch. 14 · <strong>→ paper</strong></span></p>

<h2 id="rank-ch-14-continued-the-hunt-for-fraud-does-the-damage">Rank ch. 14, continued: the hunt for fraud does the damage</h2>
<p><strong>What they claim:</strong> The belief in rampant fraud shapes policy anyway, and the policies it produces deter the eligible rather than catch cheats.</p>
<ul>
<li><strong>59%</strong> of poll respondents think lying to get SNAP is very or somewhat common.</li>
<li><strong>Drug testing.</strong> In a seven-state study, TANF recipients tested positive at <em>lower</em> rates than the general population. The millions spent &quot;would be better utilized on job training.&quot;</li>
<li><strong>Finger-imaging.</strong> Adopted in the 1990s to stop &quot;double-dipping&quot;; its effect on fraud is doubtful, its effect on applicants is not. One: &quot;It's basically like when you're going through central booking.&quot;</li>
<li><strong>Stigma.</strong> Stuber and Kronebusch, 901 clinic patients: welfare stigma reduced enrollment in both TANF and Medicaid. &quot;Stigma is likely to constitute a stronger deterrent to participation than the expected penalty for dishonest claiming.&quot;</li>
<li><strong>Asset limits.</strong> The push to lower SNAP's came from one retired Minnesotan with $1 million who applied to &quot;test&quot; the system. Most SNAP households have under <strong>$500</strong> in liquid assets; 34 states skip the asset check to get benefits out faster.</li>
</ul>
<div class="point"><b>Why it matters:</b> "Rather than encouraging fraud, the system would appear to be encouraging nonparticipation instead." Campbell said that was the point of the hurdles (p. 66). Rank and colleagues give the measure: the fraud is in hundredths of a percent, the deterrence is in millions of families.</div>
<p><span class="muted">Rank et al., ch. 14 · <strong>→ paper</strong></span></p>
</section>

<h2 id="rank-ch-15-government-programs-can-reduce-poverty">Rank ch. 15: government programs can reduce poverty</h2>
<p><strong>What they claim:</strong> The belief that government can't fix poverty is old (in 1969, three-quarters of Americans backed an all-out federal assault on poverty and 10% thought it would work). Cross-national data say it can, when a country chooses to.</p>
<table>
<thead>
<tr>
<th>Relative poverty, before and after taxes and transfers (Bernstein, OECD, Table 15.1)</th>
<th>Before</th>
<th>After</th>
<th>Reduction</th>
</tr>
</thead>
<tbody>
<tr>
<td>Sweden</td>
<td>26.7%</td>
<td>5.3%</td>
<td><strong>80%</strong></td>
</tr>
<tr>
<td>Denmark</td>
<td>23.6%</td>
<td>5.3%</td>
<td><strong>78%</strong></td>
</tr>
<tr>
<td>OECD average, excluding the U.S.</td>
<td>26.4%</td>
<td>9.8%</td>
<td><strong>63%</strong></td>
</tr>
<tr>
<td><strong>United States</strong></td>
<td>26.3%</td>
<td><strong>17.1%</strong></td>
<td><strong>35%</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>Before taxes and transfers, U.S. poverty is &quot;middle-of-the-pack.&quot; After, it is the highest in the table. Markets produce similar poverty everywhere; the welfare state decides what remains.</li>
<li>Child poverty (UNICEF, 35 countries): the others cut it 40% on average; the U.S. cut it <strong>8%</strong>, leaving 23%, ahead of only Romania. Single-parent families: elsewhere 42% → 19%; the U.S. <strong>49% → 33%</strong>. Across 20 affluent democracies, generosity and poverty correlate at <strong>−0.67</strong>.</li>
</ul>
<div class="point"><b>Why it matters:</b> Timothy Smeeding: "We have more inequality and poverty than other nations because we choose to have more." Alesina's three reasons: Americans believe redistribution favors racial minorities, believe poverty is the poor person's fault, and have a political system built to block it (Monday's chapter, in one clause).</div>
<p><span class="muted">Rank et al., ch. 15 · <strong>→ paper</strong></span></p>
</section>

<h2 id="rank-ch-15-continued-where-american-programs-have-worked">Rank ch. 15, continued: where American programs have worked</h2>
<p><strong>What they claim:</strong> The U.S. record is not uniformly weak. Where the country built a large, universal program, poverty fell as far as it fell anywhere.</p>
<ul>
<li><strong>Social Security.</strong> Elderly poverty was <strong>35%</strong> in the late 1950s and <strong>8.9%</strong> in 2019. Engelhardt and Gruber: the growth in Social Security &quot;can indeed explain all of the decline in poverty among the elderly.&quot; Without it, elderly poverty today would be <strong>39%</strong>.</li>
<li><strong>Medicare.</strong> Seniors without insurance: <strong>48%</strong> in 1963, <strong>1%</strong> by 2016. Seniors now pay 13% of their health costs out of pocket, a quarter of the 1960s share.</li>
<li><strong>The CARES Act, 2020.</strong> About $500 billion in transfers. Poverty was headed from 12.5% to 16.3%; with the transfers, the projection was 12.7%.</li>
<li>Economic security programs overall (Social Security, food assistance, working-family tax credits) &quot;have reduced the poverty rate by half since 1967&quot; (ch. 13).</li>
</ul>
<div class="point"><b>Why it matters:</b> Campbell's remedy in chapter 4 was universal programs on the Social Security model, with no cliffs and no stigma. Rank and colleagues supply the track record. The programs that work are the ones Monday's chapter said Congress has never been able to cut. Jamila Michener's closing line: "Poverty and economic deprivation are political choices."</div>
<p><span class="muted">Rank et al., ch. 15 · <strong>→ paper</strong></span></p>
</section>

<h2 id="three-readings-three-units-of-analysis">Three readings, three units of analysis</h2>
<table>
<thead>
<tr>
<th></th>
<th>Counts</th>
<th>Finds</th>
<th>Use it when your scene is about . . .</th>
</tr>

<tbody>
<tr>
<td><strong>Béland and Waddan</strong></td>
<td>Laws, votes, rolls</td>
<td>Why AFDC could be abolished; what the rolls did after</td>
<td>a rule changing, a family leaving the rolls</td>
</tr>
<tr>
<td><strong>Campbell</strong></td>
<td>One family's dollars, fifty states' rules</td>
<td>Why leaving assistance for work costs 55–80 cents on the dollar; why it depends on the state</td>
<td>a raise, a benefit lost, a move not made, a form</td>
</tr>
<tr>
<td><strong>Rank, Eppard, and Bullock</strong></td>
<td>National and cross-national rates</td>
<td>The welfare state is small, fraud is rare, and transfers cut poverty where they're large</td>
<td>a stereotype in the film, a number a character cites, a comparison to &quot;most people&quot;</td>
</tr>
</tbody>
</table>
<p>Where they agree: the working/non-working line decides who gets help, and the help for nonworkers has shrunk since 1996. Where they differ: Béland and Waddan explain the politics; Campbell and Rank judge the result, and judge it harshly.</p>
<div class="point"><b>Why it matters:</b> Step 4 of the paper asks which evidence you trust more on your claim. A two-family documentary cannot test a cross-national rate; it can test a claim about what a rule does to a household. Match the claim to the unit the film can actually show.</div>

<h2 id="carry-this-into-the-film">Carry this into the film</h2>
<p><em>Two American Families</em> follows the Neumanns and the Stanleys in <strong>Milwaukee, Wisconsin</strong>, from 1991 to 2024. Monday's slide asked you to watch for work first, the 40%, drift, flow and stock, and the 44%. Campbell and Rank add five more.</p>
<ol>
<li><strong>The cliff.</strong> Does anyone get a raise, a second job, or a marriage that costs the household a benefit? Campbell's single parent kept 45 cents of each extra dollar (p. 64).</li>
<li><strong>The asset test.</strong> Does anyone sell something, spend down, or refuse to save? Wisconsin had no Medicaid asset test (Table 5.1), but TANF and other programs are another matter.</li>
<li><strong>The job on the other side.</strong> Does the job that replaced welfare carry health insurance, child care, a living wage? Edin and Lein (p. 65) say that is the question.</li>
<li><strong>Take-up and stigma.</strong> Is there help the family qualifies for and doesn't ask for, or can't get through the door? Half of eligible Californians weren't on SNAP (p. 86). Rank: the hurdles deter applicants, not fraud (ch. 14).</li>
<li><strong>Choice.</strong> Could either family have moved to a more generous state? What holds them in Milwaukee? Compare Dave and Marcella in Redding (p. 97).</li>
</ol>
<p>Two households are still not national data. That is <strong>step 4</strong> of your paper: which kind of evidence fits the claim you picked.</p>
</section>

<h2 id="discussion-paper-3-claims-you-could-use">Discussion Paper 3: claims you could use</h2>
<p>About <strong>600 words</strong>, due <strong>Friday 10/23, 11:59 p.m.</strong> One moment from the film, one claim from the readings. Monday's deck listed five claims from Béland and Waddan. From Campbell:</p>
<ul>
<li>A single parent with two children who goes from $10,000 to $40,000 keeps 45 cents of each extra dollar, or 20 cents if the family had TANF and housing aid (p. 64)</li>
<li>Mississippi's maximum TANF benefit is 11% of the poverty line, $2,040 a year for a family of three (p. 59)</li>
<li>Forty years ago four in five poor children got welfare; now four in five do not (p. 75); in a dozen states fewer than one in ten did in 2009 (p. 76)</li>
<li>Mothers who left welfare for work had more hardship and were much more likely to lack medical coverage than mothers who stayed (p. 65)</li>
<li>States cut social assistance in recessions, when need is highest (pp. 92–93)</li>
<li>&quot;Policy makers rail against a 'cycle of poverty,' but then design programs that create a cycle of poverty&quot; (p. 67)</li>
</ul>
<p>From Rank, Eppard, and Bullock (cite the page the Pollak reader shows):</p>
<ul>
<li>TANF served 68 of every 100 poor families in 1996 and 23 in 2017; the median state paid $486 a month in 2018 (ch. 13)</li>
<li>Recipient fraud is $11 of every $10,000 in SNAP benefits; the average benefit is $1.39 a meal (ch. 14)</li>
<li>U.S. taxes and transfers cut poverty 35%, against an OECD average of 63% (ch. 15)</li>
</ul>
</section>

<h2 id="discussion-paper-3-the-four-steps">Discussion Paper 3: the four steps</h2>
<p>The full prompt is on Canvas. Same steps as Monday's deck.</p>
<ol>
<li><strong>One moment</strong> from the film: a specific scene, person, or decision I could find.</li>
<li><strong>One claim</strong> from the readings about what reform or the safety net does, with a <strong>page number</strong>.</li>
<li><strong>Does the moment support or challenge the claim?</strong> Show how, with detail from the scene.</li>
<li><strong>Which do you trust more</strong> on this point, the film or the reading, and why? Say which kind of evidence fits the kind of claim: two households can test what a rule does to a family; they cannot test a national rate.</li>
</ol>
<p>A claim from Campbell pairs best with a scene about a rule. A claim from Rank pairs best with a scene where someone in the film states a belief about welfare that the numbers can check.</p>
</section>

<h2 id="next-week-in-the-room">Next week, in the room</h2>
<p><strong>Monday 10/26: health care reform and the ACA.</strong> Jacobs and Skocpol, chs. 1–4; Hacker (2010).</p>
<p>Campbell wrote in 2014, as the Supreme Court had just made the ACA's Medicaid expansion optional. Her twenty-four states with no asset test and her sixteen states cutting parents off below half of poverty are the map that expansion was drawn on. Keep chapter 5 open when you read Jacobs and Skocpol.</p>
<p><strong>Policy briefs (undergraduates) due Wednesday 10/28.</strong></p>
<p><span class="muted">Film by Friday. Paper Friday night. Email me with questions.</span></p>
